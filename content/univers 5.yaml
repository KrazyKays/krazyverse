questions:
  - id: q-u5-poucet
    targetNodeId: u5-poucet
    access: adjacent
    requiresRevealed:
      - u2-loup
    context: "Anselme a ce matin autant de fils que le dé a de points. C'est le même dé, le même matin, que dans l'histoire du Petit Chaperon rouge de cet univers."
    prompt: "Combien de fils Anselme a-t-il ce matin ?"
    answers:
      - six
      - "6"
    hint: "Qu'a donné le dé de Vorgas ?"
    wrongFeedback: "Ce n'est pas ce que le dé a donné ce matin."

  - id: q-u5-cailloux
    targetNodeId: u5-cailloux
    access: adjacent
    requiresRevealed:
      - u4-poucet
      - u5-poucet
    context: "Le nombre de fils change d'un univers à l'autre, mais l'habitude de Poucet ne change pas : il prend le même nombre de cailloux par fils que dans l'Univers 42."
    prompt: "Combien de cailloux Poucet sème-t-il ici ?"
    answers:
      - "24"
      - vingt-quatre
    hint: "Prenez la méthode de l'Univers 42 et le nombre de fils de ce matin."
    wrongFeedback: "Le compte n'y est pas : la méthode vient d'ailleurs, le nombre de fils vient d'ici."

  - id: q-u5-miettes
    targetNodeId: u5-miettes
    access: adjacent
    requiresRevealed: []
    context: "Le hasard n'a pas laissé à Poucet son pain : il lui impose autre chose à semer."
    prompt: "Que sème Poucet la seconde fois ?"
    answers:
      - plumes
    hint: "Le dé l'a décidé à la fin du récit des cailloux."
    wrongFeedback: "Ce n'est pas ce que le dé a décidé."

  - id: q-u5-manoir
    targetNodeId: u5-manoir
    access: adjacent
    requiresRevealed:
      - u2-maison
    context: "Ce soir, la demeure de l'ogre occupe l'endroit exact où se trouvait, hier, la maison d'Oldrine."
    prompt: "Où se trouve la demeure de l'ogre ?"
    answers:
      - lac
    hint: "La maison d'Oldrine se souvient de son emplacement de la veille."
    wrongFeedback: "Ce n'est pas là que se trouvait la maison hier."

  - id: q-u5-ogre
    targetNodeId: u5-ogre
    access: adjacent
    requiresRevealed:
      - u5-manoir
      - u2-loup
    context: "Maître Gripon a relancé le dé du matin. Sa règle est gravée dans la demeure ; le résultat du dé, vous le connaissez déjà."
    prompt: "Que fait l'ogre ce soir-là ?"
    answers:
      - dort
      - dormir
    hint: "Le dé de Vorgas est-il tombé sur un chiffre pair ou impair ?"
    wrongFeedback: "Relisez la règle gravée : le dé en a décidé autrement."

  - id: q-u5-couronnes
    targetNodeId: u5-couronnes
    access: adjacent
    requiresRevealed:
      - u4-couronnes
      - u2-denouement
    context: "Depuis la parasyndèse, personne ne peut plus mentir dans l'Univers 2345. Poucet se retrouve devant les filles de l'ogre dans la même impasse que dans l'Univers 42 : il devra s'en sortir de la même façon, sans un mot."
    prompt: "Quel geste Poucet doit-il faire ?"
    answers:
      - échange
      - échanger
      - couronnes
    hint: "Comment s'en est-il sorti dans l'Univers 42, là où il est impossible de mentir ?"
    wrongFeedback: "Cela demanderait de mentir, ce qui n'est plus possible ici."

  - id: q-u5-bottes
    targetNodeId: u5-bottes
    access: adjacent
    requiresRevealed:
      - u5-couronnes
      - u2-denouement
    context: "Le Bureau a horodaté trois témoignages sur l'emplacement des bottes. Ils se contredisent, mais tous n'ont pas la même valeur. Rappelez-vous l'heure à laquelle la première parasyndèse a frappé cet univers, et ce qu'elle a changé."
    prompt: "Où se trouvent vraiment les bottes ?"
    answers:
      - lit
    hint: "À quelle heure la scène s'est-elle jouée, et que devient le mensonge après elle ?"
    wrongFeedback: "Ce témoignage date d'une heure où l'on pouvait encore mentir."

  - id: q-u5-denouement
    targetNodeId: u5-denouement
    access: adjacent
    requiresRevealed:
      - u5-bottes
      - u6-denouement
    context: "Poucet entre chez un notaire, pose les bottes sur le bureau, compte sept cents écus et signe de son pouce. Cette scène, vous l'avez déjà lue quelque part."
    prompt: "Dans quel univers ce dénouement s'est-il déjà produit ?"
    answers:
      - "440"
      - quatre cent quarante
    hint: "Dans quel univers signe-t-on tout chez un notaire ?"
    wrongFeedback: "Ce n'est pas dans cet univers-là que la scène s'est jouée."
