# Référence : les ids doivent être uniques et les liens doivent pointer vers des ids existants.

id: universe5
name: "Univers 2345 · Poucet"
kind: tale
tagline: "Le hasard de l'Univers 2345, un autre conte : le Bureau n'ouvre ce dossier qu'après la première parasyndèse."

nodes:
  - id: u5-chaumiere
    kind: place
    title: "La chaumière"
    position: { x: 140, y: 380 }
    homologueKey: chaumiere
    intro: "Dans l'Univers 2345, la chaumière n'est jamais du même côté de la forêt. Ce matin, tout l'univers obéit à un seul dé, celui-là même qui a décidé pour Vorgas. Le bûcheron compte ses fils au réveil : il en a autant que le dé a de points. Personne ne s'en étonne."
  - id: u5-bucheron
    kind: character
    title: "Le bûcheron"
    position: { x: 150, y: 170 }
    homologueKey: bucheron
    intro: "Anselme a tiré à pile ou face le sort de ses enfants. La pièce a dit : la forêt. Hier, elle disait : le carnaval. Depuis la parasyndèse, il ne peut plus mentir, ce qui l'embarrasse beaucoup : il doit désormais avouer qu'il n'a aucune idée de ce qu'il fait."
  - id: u5-poucet
    kind: character
    title: "Le Petit Poucet"
    position: { x: 330, y: 250 }
    homologueKey: poucet
    intro: "Ce matin, Anselme a 6 fils. Le dernier change de taille d'une heure à l'autre, mais une habitude ne l'a jamais quitté : au moment de partir, il remplit ses poches de cailloux, toujours le même nombre par fils."
  - id: u5-cailloux
    kind: event
    title: "Les cailloux"
    position: { x: 380, y: 450 }
    homologueKey: cailloux
    intro: "Poucet sème ses 24 cailloux, mais ici le chemin n'attend pas : le lendemain, ils se trouvent tous dans une autre forêt. Les frères ne rentrent que parce que la chaumière est venue s'installer à côté d'eux. Le dé décide alors de la suite : la seconde fois, Poucet n'emportera ni pierres, ni pain, mais des plumes."
  - id: u5-miettes
    kind: event
    title: "Les plumes"
    position: { x: 520, y: 610 }
    homologueKey: miettes
    intro: "Le vent emporte les plumes dès la première clairière. Perdus, les frères tombent sur la demeure de l'ogre. Chaque nuit, ici, les maisons échangent leurs places : ce soir, la demeure occupe l'endroit exact où se trouvait, hier, la maison d'Oldrine."
  - id: u5-manoir
    kind: place
    title: "La demeure de l'ogre"
    position: { x: 730, y: 610 }
    homologueKey: manoir
    intro: "La demeure repose au fond du lac, et l'on y respire très bien. Sur la table, le dé attend le maître des lieux, car Maître Gripon ne décide plus rien lui-même. Sa règle est gravée sur le plateau : « Pair, je dors. Impair, je mange. » Ce soir-là, il a relancé le dé du matin, et le dé, fidèle pour une fois, est retombé sur le même chiffre."
  - id: u5-ogre
    kind: character
    title: "L'ogre"
    position: { x: 680, y: 380 }
    homologueKey: ogre
    intro: "Gripon dort, le nez dans son assiette vide. Ses filles, elles, ne dorment pas : elles portent ce soir des couronnes tirées au sort et posent mille questions. Depuis la parasyndèse, Poucet ne peut plus répondre que la vérité, et elles finiront par réveiller leur père."
  - id: u5-couronnes
    kind: event
    title: "L'échange des couronnes"
    position: { x: 700, y: 160 }
    homologueKey: couronnes
    intro: "Poucet procède à l'échange des couronnes contre des bonnets, comme dans un conte qu'il n'a jamais lu. Reste à trouver les bottes de l'ogre. Le Bureau a horodaté trois témoignages recueillis le jour de la parasyndèse. Le corbeau, à dix heures : « Elles sont dans le puits. » La cuisinière, à onze heures : « Elles sont sur le toit. » L'ogresse, à quinze heures : « Elles sont sous le lit. »"
  - id: u5-bottes
    kind: event
    title: "Les bottes"
    position: { x: 880, y: 250 }
    homologueKey: bottes
    intro: "Les bottes étaient bien sous le lit : l'ogresse ne pouvait plus mentir. Le puits et le toit dataient d'avant la parasyndèse, quand chacun disait encore ce qui lui passait par la tête. Selon le pied qui les chausse, elles font sept lieues, ou trois pas, ou demi-tour."
  - id: u5-denouement
    kind: event
    title: "Le dénouement"
    position: { x: 880, y: 480 }
    homologueKey: denouement-poucet
    intro: "Chez Maître Plumet, le Petit Poucet pose les bottes sur le bureau, compte sept cents écus et signe de son pouce. Mot pour mot, geste pour geste, c'est la scène de l'Univers 440. Personne ici n'a jamais entendu parler de Plumet : le hasard l'a simplement assis là. Seconde parasyndèse. Depuis, le boulanger de l'Univers 2345 réclame un écu pour chaque fournée, que le four ait donné une galette ou une brioche."

