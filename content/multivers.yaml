# Univers central. Chaque nœud, relation et question est lu par l'application.
# Référence : les ids doivent être uniques et les liens doivent pointer vers des ids existants.

id: meta-enquete
name: "Le multivers"
kind: meta
tagline: "Chaque univers a ses propres règles, mais à partir de quel moment peut-on qualifier un univers de défaillant ? La mission qui vous a été confiée est de parcourir ces univers, dans un premier temps pour assimiler leurs spécificités, et cela vous conduira peut-être à faire des découvertes qui vous permettrons de répondre aux questions qui régissent le monde entier."

nodes:
  - id: meta-origine
    kind: event
    title: "Les univers et leurs règles"
    position: { x: 500, y: 120 }
    homologueKey: meta-origine
    intro: "Pourquoi les règles sont elles créées ? Il semblerait que chaque univers naisse avec une règle qui lui est propre, qui nous permet de les distinguer les uns des autres, mais à quoi cela sert-il concrètement ? Il semblerait qu'une force cosmique cherche à ce que les évènements qui se déroulent dans chaque univers diffèrent à tout prix."
    central:
      required: true
    revealedAtStart: true

  - id: meta-anomalie-1
    kind: event
    title: "La parasyndèse"
    position: { x: 300, y: 300 }
    homologueKey: ""
    intro: "On nomme parasyndèse, un évènement qui se déroule de façon similaire dans deux univers différents, il a pour conséquence de"
    central:
      required: true

relations:
  - { id: rm-origine-anomalie-1, from: meta-origine, to: meta-anomalie-1 }

questions:

  - id: q-meta-anomalie-1
    targetNodeId: meta-anomalie-1
    access: enquete
    requiresRevealed:
      - u1-chasseur-copie
    context: "Personne ne sais ce qui pourrait se passer si deux évènements, dans deux univers distincts se déroulaient de façon totalement identique."
    prompt: "Quel est le nom de ce phénomène ?"
    answers:
      - "parasyndèse"
    wrongFeedback: "Mauvaise réponse, il existe un terme spécifique."

ending:
  title: "Votre mission est terminée !"
  body: "Fin du jeu."
