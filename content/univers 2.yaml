# Référence : les ids doivent être uniques et les liens doivent pointer vers des ids existants.

id: universe2
name: "Univers 2345"
kind: tale
tagline: "Un univers chaotique où le hasard décide de tout. Rien n'y est prévisible, sauf le fait de ne pas savoir ce qui va arriver."

nodes:
  - id: u2-centre
    kind: place
    title: "Le village"
    position: { x: 140, y: 380 }
    homologueKey: centre
    intro: "Dans l'Univers 2345, le hasard décide de tout. Le soleil se lève parfois à l'ouest, les rivières changent de lit sans prévenir, et l'on ne sait jamais si le pain sortira du four en galette ou en brioche. Les habitants s'en accommodent : ici, rien ne se produit deux fois de la même manière. C'est du moins ce que tout le monde croit."
    revealedAtStart: true
  - id: u2-mere
    kind: character
    title: "La mère"
    position: { x: 150, y: 170 }
    homologueKey: mere
    intro: "Maëlle a tiré à pile ou face le contenu du panier : ce sera une galette, un pot de beurre… et une boussole qui indique une direction différente à chaque coup d'œil. « Va voir ta grand-mère, dit-elle. Ou n'y va pas. On verra bien. »"
  - id: u2-rouge
    kind: character
    title: "Le Petit Chaperon rouge"
    position: { x: 330, y: 250 }
    homologueKey: rouge
    intro: "Le Petit Chaperon rouge sait que le plus court chemin entre deux points n'existe pas ici. Plutôt que de chercher le sentier, elle préfère vadrouiller au hasard entre les arbres, jusqu'à tomber sur sa destination… ou sur une autre."
  - id: u2-sentier
    kind: place
    title: "Le sentier des Aubépines"
    position: { x: 380, y: 450 }
    homologueKey: sentier
    intro: "Le sentier change de tracé chaque matin. Il ne mène pas toujours où l'on croit, et parfois il ne mène nulle part. On y croise tantôt un loup, tantôt un ours, tantôt personne. Aujourd'hui, le hasard l'a fait aboutir à une maison aux volets verts."
  - id: u2-loup
    kind: character
    title: "Le loup"
    position: { x: 520, y: 610 }
    homologueKey: loup
    intro: "Vorgas est tantôt amical, tantôt affamé : il laisse un dé décider. Ce matin, le dé a donné six. Six, c'est le raccourci. Il file à travers les arbres en abandonnant l'enfant au milieu du chemin."
  - id: u2-raccourci
    kind: place
    title: "Le raccourci des Ronces"
    position: { x: 730, y: 610 }
    homologueKey: raccourci
    intro: "Aujourd'hui, le raccourci est plus long que le sentier. Vorgas s'y perd, en ressort de l'autre côté de la forêt et oublie pourquoi il était venu. Le hasard a retiré le loup de l'histoire."
  - id: u2-maison
    kind: place
    title: "La maison aux volets verts"
    position: { x: 680, y: 380 }
    homologueKey: maison
    intro: "La maison est apparue au bout du sentier cette nuit. Hier, elle se trouvait au fond d'un lac ; demain, qui sait ? À l'intérieur, la vieille horloge sonne des heures au hasard, et tout le monde a appris à ne plus s'y fier."
  - id: u2-grand-mere
    kind: character
    title: "La grand-mère"
    position: { x: 700, y: 160 }
    homologueKey: grand-mere
    intro: "Oldrine change d'humeur sans prévenir. Elle peut accueillir sa petite-fille à bras ouverts, ou jurer n'avoir jamais eu d'enfant. Aujourd'hui, elle est d'excellente humeur et met de l'eau à chauffer pour le thé."
  - id: u2-chasseur
    kind: character
    title: "Le chasseur"
    position: { x: 880, y: 250 }
    homologueKey: chasseur
    intro: "Brenn arrive ou n'arrive pas, selon le hasard. D'ordinaire, il passe à n'importe quelle heure, frappe un nombre de coups tiré au sort et entre par la fenêtre une fois sur deux. Mais aujourd'hui, l'horloge affolée sonne midi au bon moment, et Brenn frappe à la porte."
  - id: u2-denouement
    kind: event
    title: "Le dénouement"
    position: { x: 880, y: 480 }
    homologueKey: denouement
    intro: "À midi sonnant, Brenn frappe trois coups à la porte, entre, pose son fusil contre l'horloge et dit : « Tout le monde est sain et sauf. » Mot pour mot, geste pour geste, c'est la scène de l'Univers 42. Le Bureau connaît ce phénomène, qu'il croyait impossible, et le nomme parasyndèse : un même événement, survenu à l'identique dans deux univers. Depuis, une chose étrange se produit dans l'Univers 2345 : plus personne n'arrive à mentir."

relations:
  - { id: link-u2-centre-mere, from: u2-centre, to: u2-mere }
  - { id: link-u2-centre-rouge, from: u2-centre, to: u2-rouge }
  - { id: link-u2-mere-rouge, from: u2-mere, to: u2-rouge }
  - { id: link-u2-centre-sentier, from: u2-centre, to: u2-sentier }
  - { id: link-u2-sentier-loup, from: u2-sentier, to: u2-loup }
  - { id: link-u2-loup-raccourci, from: u2-loup, to: u2-raccourci }
  - { id: link-u2-raccourci-maison, from: u2-raccourci, to: u2-maison }
  - { id: link-u2-sentier-maison, from: u2-sentier, to: u2-maison }
  - { id: link-u2-maison-grand-mere, from: u2-maison, to: u2-grand-mere }
  - { id: link-u2-maison-chasseur, from: u2-maison, to: u2-chasseur }
