  - { id: link-u2-chasseur-denouement, from: u2-chasseur, to: u2-denouement }

questions:
  - id: q-u2-rouge
    targetNodeId: u2-rouge
    access: adjacent
    requiresRevealed: []
    context: "Ici, rien n'est jamais pareil d'un jour à l'autre."
    prompt: "Qu'est-ce qui décide de tout dans cet univers ?"
    answers:
      - hasard
    hint: "L'accroche de l'univers le dit clairement."
    wrongFeedback: "Ce n'est pas cela qui gouverne l'Univers 2345."

  - id: q-u2-sentier
    targetNodeId: u2-sentier
    access: adjacent
    requiresRevealed:
      - u1-sentier
    context: "Le sentier change de tracé chaque matin, mais il a gardé le nom qu'il porte dans l'Univers 42."
    prompt: "Comment s'appelle ce sentier ?"
    answers:
      - Aubépines
    hint: "Les noms traversent les univers : cherchez dans l'Univers 42."
    wrongFeedback: "Ce n'est pas son nom dans les autres univers."

  - id: q-u2-loup
    targetNodeId: u2-loup
    access: adjacent
    requiresRevealed:
      - u1-loup
    context: "Sur le sentier, on croise tantôt un loup, tantôt un ours. Aujourd'hui, c'est un loup, et vous l'avez déjà rencontré ailleurs."
    prompt: "Comment s'appelle ce loup ?"
    answers:
      - Vorgas
    hint: "Il porte le même nom que dans l'Univers 42."
    wrongFeedback: "Ce n'est pas son nom."

  - id: q-u2-raccourci
    targetNodeId: u2-raccourci
    access: adjacent
    requiresRevealed: []
    context: "Le loup laisse un dé décider de son chemin."
    prompt: "Quel chiffre le dé a-t-il donné ce matin ?"
    answers:
      - six
      - "6"
    hint: "Relisez le portrait de Vorgas dans cet univers."
    wrongFeedback: "Le dé est tombé sur un autre chiffre."

  - id: q-u2-maison
    targetNodeId: u2-maison
    access: adjacent
    requiresRevealed: []
    context: "La maison de la grand-mère n'est jamais au même endroit, ni de la même couleur."
    prompt: "De quelle couleur sont ses volets aujourd'hui ?"
    answers:
      - verts
    hint: "Le sentier vous y a mené aujourd'hui."
    wrongFeedback: "Pas aujourd'hui."

  - id: q-u2-chasseur
    targetNodeId: u2-chasseur
    access: adjacent
    requiresRevealed:
      - u1-chasseur
    context: "Un chasseur rôde parfois dans les environs de la maison, quand le hasard le veut bien."
    prompt: "Comment s'appelle ce chasseur ?"
    answers:
      - Brenn
    hint: "Il porte le même nom que l'ami d'Oldrine dans l'Univers 42."
    wrongFeedback: "Ce n'est pas son nom."

  - id: q-u2-denouement
    targetNodeId: u2-denouement
    access: adjacent
    requiresRevealed:
      - u2-chasseur
      - u1-denouement
    context: "Pour une fois, l'horloge sonne midi au bon moment et Brenn frappe trois coups. Cette scène, vous l'avez déjà lue quelque part."
    prompt: "Dans quel univers ce dénouement s'est-il déjà produit ?"
    answers:
      - "42"
      - "quarante-deux"
    hint: "Comparez avec les dénouements que vous avez déjà découverts."
    wrongFeedback: "Ce n'est pas dans cet univers-là que la scène s'est jouée."
