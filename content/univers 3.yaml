questions:
  - id: q-u3-rouge
    targetNodeId: u3-rouge
    access: adjacent
    requiresRevealed: []
    context: "Ici, tout a un prix."
    prompt: "Qu'est-ce qui dirige tout dans cet univers ?"
    answers:
      - argent
      - écus
    hint: "L'accroche de l'univers le dit clairement."
    wrongFeedback: "Ce n'est pas cela qui gouverne l'Univers 440."

  - id: q-u3-sentier
    targetNodeId: u3-sentier
    access: adjacent
    requiresRevealed:
      - u3-rouge
    context: "Le Petit Chaperon rouge compte sa monnaie avant de partir."
    prompt: "Combien coûte le péage du sentier ?"
    answers:
      - cinq
      - "5"
    hint: "Comptez avec le Petit Chaperon rouge."
    wrongFeedback: "Ce n'est pas le tarif de cette saison."

  - id: q-u3-loup
    targetNodeId: u3-loup
    access: adjacent
    requiresRevealed:
      - u1-loup
    context: "Au poste de péage, un loup en gilet se fait appeler « Monsieur V. »."
    prompt: "Quel est le vrai nom de « Monsieur V. » ?"
    answers:
      - Vorgas
    hint: "Les noms traversent les univers."
    wrongFeedback: "Ce n'est pas son vrai nom."

  - id: q-u3-raccourci
    targetNodeId: u3-raccourci
    access: adjacent
    requiresRevealed:
      - u1-raccourci
    context: "Le loup vend des tickets pour un raccourci privé, qu'il a racheté l'hiver dernier."
    prompt: "Quel raccourci le loup a-t-il racheté ?"
    answers:
      - Ronces
    hint: "Ce raccourci existe aussi dans l'Univers 42."
    wrongFeedback: "Ce n'est pas ce raccourci-là."

  - id: q-u3-maison
    targetNodeId: u3-maison
    access: adjacent
    requiresRevealed: []
    context: "La maison de la grand-mère est convoitée. Un panneau, le long du sentier, nomme celui qui la guette."
    prompt: "Quel promoteur convoite la maison ?"
    answers:
      - Gripon
    hint: "Lisez le panneau du sentier à péage."
    wrongFeedback: "Ce n'est pas le nom du promoteur."

  - id: q-u3-chasseur
    targetNodeId: u3-chasseur
    access: adjacent
    requiresRevealed:
      - u3-grand-mere
      - u1-chasseur
    context: "Le contrat d'Oldrine fixe le tarif au nombre de coups que sonne l'horloge quand le chasseur frappe. L'heure, elle, se lit dans un autre univers."
    prompt: "Combien d'écus coûte un déplacement du chasseur ?"
    answers:
      - "120"
      - cent vingt
    hint: "À quelle heure Brenn frappe-t-il dans l'Univers 42 ? Combien de coups l'horloge sonne-t-elle alors ?"
    wrongFeedback: "Ce n'est pas son tarif. Refaites le compte des coups."

  - id: q-u3-denouement
    targetNodeId: u3-denouement
    access: adjacent
    requiresRevealed:
      - u3-chasseur
    context: "Ici, aucune histoire ne se dénoue sans contrat signé."
    prompt: "Chez quel notaire tout le monde vient-il signer ?"
    answers:
      - Plumet
    hint: "Le chasseur ne se déplace jamais sans passer chez lui."
    wrongFeedback: "Ce n'est pas le nom du notaire."
    alsoRevealed:
      - u3-plumet

  - id: q-u3-poucet
    targetNodeId: u3-poucet
    access: adjacent
    requiresRevealed:
      - u1-poucet
    context: "Le budget d'Anselme ne donne que le coût par fils. Le nombre de fils, lui, est le même que dans l'Univers 42."
    prompt: "Combien d'écus Anselme économise-t-il par semaine en abandonnant ses fils ?"
    answers:
      - "21"
      - vingt et un
    hint: "Multipliez le coût par fils par le nombre de fils de l'Univers 42."
    wrongFeedback: "Le compte n'est pas bon. Ici, on ne vous fera pas de cadeau."

  - id: q-u3-cailloux
    targetNodeId: u3-cailloux
    access: adjacent
    requiresRevealed:
      - u1-cailloux
      - u3-poucet
    context: "Ici, les cailloux blancs se vendent à la pièce. Le chemin à marquer, lui, n'a pas changé depuis l'Univers 42 : il faut le même nombre de cailloux."
    prompt: "Combien d'écus Poucet doit-il débourser pour ses cailloux ?"
    answers:
      - "56"
      - cinquante-six
    hint: "Le nombre de cailloux vient de l'Univers 42, le prix de la carrière de celui-ci."
    wrongFeedback: "La caisse de la carrière ne tombe pas juste."

  - id: q-u3-miettes
    targetNodeId: u3-miettes
    access: adjacent
    requiresRevealed:
      - u1-miettes
    context: "La carrière refuse tout crédit. Poucet se rabat sur ce qu'il a semé dans l'Univers 42 quand il a été à court de cailloux."
    prompt: "Que sème-t-il la seconde fois ?"
    answers:
      - pain
      - miettes
    hint: "Voyez comment s'est passée la seconde fois dans l'Univers 42."
    wrongFeedback: "Ce n'est pas ce qu'il a semé dans l'Univers 42."

  - id: q-u3-manoir
    targetNodeId: u3-manoir
    access: adjacent
    requiresRevealed:
      - u3-sentier
      - u3-poucet
    context: "La Société a racheté le sentier à péage du Petit Chaperon rouge, et son portier applique le même tarif, par fils, à l'entrée du siège."
    prompt: "Combien d'écus la fratrie de Poucet paie-t-elle pour entrer ?"
    answers:
      - "35"
      - trente-cinq
    hint: "Le tarif du sentier, multiplié par le nombre de fils."
    wrongFeedback: "Le portier recompte et secoue la tête."

  - id: q-u3-ogre
    targetNodeId: u3-ogre
    access: adjacent
    requiresRevealed:
      - u3-maison
      - u3-miettes
    context: "Ici, l'ogre n'est pas un mangeur d'enfants. Il dévore les terres par lots, et son nom figure sur un panneau de lotissement de cet univers."
    prompt: "Qui est l'ogre de l'Univers 440 ?"
    answers:
      - Gripon
    hint: "Qui convoite la maison d'Oldrine ?"
    wrongFeedback: "Ce n'est pas le nom inscrit sur le panneau."

  - id: q-u3-couronnes
    targetNodeId: u3-couronnes
    access: adjacent
    requiresRevealed:
      - u1-couronnes
    context: "Dans l'Univers 42, on ne pouvait pas mentir : Poucet a échangé les couronnes sans un mot. Mais ici, une couronne d'or inscrite au bilan a d'abord une valeur."
    prompt: "Que fait donc Poucet des couronnes, dans cet univers ?"
    answers:
      - vend
      - vendre
      - vendues
      - revend
      - revendre
      - vente
    hint: "Que fait-on de tout dans l'Univers 440 ?"
    wrongFeedback: "Ce serait un geste gratuit. Rien n'est gratuit ici."

  - id: q-u3-bottes
    targetNodeId: u3-bottes
    access: adjacent
    requiresRevealed:
      - u1-bottes
      - u3-couronnes
    context: "Les bottes de l'ogre font ici le même trajet que dans l'Univers 42. Or Poucet se fait payer à la lieue."
    prompt: "Combien d'écus Poucet facture-t-il pour une seule enjambée ?"
    answers:
      - "70"
      - soixante-dix
      - septante
    hint: "Le nombre de lieues vient de l'Univers 42, le tarif de celui-ci."
    wrongFeedback: "Votre facture ne passerait pas au contrôle."

  - id: q-u3-denouement-poucet
    targetNodeId: u3-denouement-poucet
    access: adjacent
    requiresRevealed:
      - u3-bottes
      - u3-plumet
    context: "Ici, aucune histoire ne se dénoue sans contrat signé, et les bottes se vendent comme le reste. Vous connaissez déjà le notaire du village."
    prompt: "Chez quel notaire Poucet vend-il ses bottes ?"
    answers:
      - Plumet
    hint: "Il figure déjà sur la toile, entre les deux contes."
    wrongFeedback: "Ce n'est pas le nom du notaire."
